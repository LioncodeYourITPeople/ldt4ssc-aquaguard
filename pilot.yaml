# LDT4SSC pilot metadata
#
# This file describes your pilot at a glance and is read by the LDT4SSC
# aggregator to know what your pilot is and how to present it on the
# Knowledge Hub and the project website.
#
# This is the FIRST FILE you should edit after creating your pilot
# repository from the template. A pilot repository without a properly
# filled-in pilot.yaml will not be picked up by the aggregator.
#
# Replace all placeholder values (in <angle brackets>) with your pilot's
# real information. Remove any optional fields you do not use.

schema_version: 1

# Short name of the pilot, in lowercase with hyphens (used in URLs)
short_name: aquaguard

# Human-readable name of the pilot
name: AquaGuard

# Short description of the pilot (one or two sentences)
description: >
  Cross-border Local Digital Twin for Pangaion (Greece) and Limanu
  (Romania) that uses Copernicus Sentinel, ECMWF weather forecasts, and
  open EU geospatial data to deliver flood-risk early warning and
  policy what-if scenarios — without local IoT sensor hardware.

# LDT4SSC work strand: WS1, WS2, or WS3
work_strand: WS2

# The cities, regions, or communities involved in this pilot
locations:
  - city: Pangaion
    country: Greece
    country_code: GR
  - city: Limanu
    country: Romania
    country_code: RO

# The thematic focus areas of the pilot, drawn from the LDT4SSC topic list.
# Pick all that apply. The full list is documented in the LDT4SSC Knowledge
# Hub under Resources for Pilots.
focus_areas:
  - climate-change
  - water-management
  - urban-planning

# The consortium members participating in this pilot
consortium:
  - name: LIONCODE PC
    role: Pilot lead
    country_code: GR
    website: https://lioncode.gr
  - name: Municipality of Pangaion
    role: Public authority
    country_code: GR
    website: https://dimospaggaiou.gr
  - name: Commune of Limanu
    role: Public authority
    country_code: RO
    website: https://primarialimanu.ro
  - name: LabGeo — Aristotle University of Thessaloniki
    role: Research
    country_code: GR
    website: https://www.auth.gr

# Primary contact for the pilot
contact:
  name: Chrysafis Nathanailidis
  email: nathanailidis@lioncode.gr
  organisation: LIONCODE PC

# Date the pilot started (ISO 8601 format: YYYY-MM-DD)
start_date: 2026-06-01

# Optional: expected end date of the pilot (18 months)
end_date: 2027-11-30

# Optional: list of external repositories or websites associated with this pilot
external_links:
  - label: Pilot repository
    url: https://github.com/LioncodeYourITPeople/aqua-guard
  - label: LDT4SSC Knowledge Hub
    url: https://knowledgehub.ldt4ssc.eu/
